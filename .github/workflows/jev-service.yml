name: Build Jev CUDA service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jev-runtime/**"
      - ".github/workflows/jev-service.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./jev-runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mars-fan-scout-jev:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mars-fan-scout-jev:latest
